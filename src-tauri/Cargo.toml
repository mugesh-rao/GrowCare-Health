[package]
name = "growcare"
version = "1.0.0"
description = "GrowCare desktop application"
authors = ["GrowCare"]
edition = "2021"

[lib]
name = "growcare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
